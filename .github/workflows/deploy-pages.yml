name: Deploy Food App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p site
          cat payload/part*.b64 | base64 -d | gzip -dc > site/index.html
          test $(wc -c < site/index.html) -gt 100000
          grep -q '<!doctype html>' site/index.html
          touch site/.nojekyll

      - name: Inspect planner selector
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('site/index.html').read_text(encoding='utf-8')
          for needle in ['Món chính','Món rau','Món canh','Món một bữa','Cơm trắng','selector-type-chips']:
              print('\n===== ',needle,' =====')
              start=0
              found=0
              while True:
                  i=s.find(needle,start)
                  if i<0 or found>=4: break
                  print(s[max(0,i-700):min(len(s),i+1200)])
                  print('\n---')
                  start=i+len(needle); found+=1
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
