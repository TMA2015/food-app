name: Deploy Food App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p site
          cat payload/part*.b64 | base64 -d | gzip -dc > site/index.html
          test $(wc -c < site/index.html) -gt 100000
          grep -q '<!doctype html>' site/index.html
          touch site/.nojekyll

      - name: Add rice tab to planner selector
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          old="function candidatesFor(role,category){if(role==='main')return mainPool();if(role==='veg')return vegPool();if(role==='soup')return soupPool();return category?completeByCategory(category):completePool()}"
          new="function candidatesFor(role,category){if(role==='main')return mainPool();if(role==='veg')return vegPool();if(role==='soup')return soupPool();if(role==='rice')return [rice];return category?completeByCategory(category):completePool()}"
          if old not in s:
              raise SystemExit('candidatesFor pattern not found')
          s=s.replace(old,new,1)
          old_tabs="const selectorTabs=[['Món chính','main',null],['Món rau','veg',null],['Món canh','soup',null],['Món một bữa','complete','all'],['Bún / Phở / Mì','complete','noodles'],['Cơm một món','complete','rice_plate'],['Salad / Gỏi','complete','salad'],['Lẩu / BBQ / Âu','complete','themes'],['Ăn ngoài','complete','outside']];"
          new_tabs="const selectorTabs=[['Món chính','main',null],['Món rau','veg',null],['Món canh','soup',null],['Cơm','rice',null],['Món một bữa','complete','all'],['Bún / Phở / Mì','complete','noodles'],['Cơm một món','complete','rice_plate'],['Salad / Gỏi','complete','salad'],['Lẩu / BBQ / Âu','complete','themes'],['Ăn ngoài','complete','outside']];"
          if old_tabs not in s:
              raise SystemExit('selectorTabs pattern not found')
          s=s.replace(old_tabs,new_tabs,1)
          p.write_text(s,encoding='utf-8')
          assert "['Cơm','rice',null]" in s
          assert "if(role==='rice')return [rice]" in s
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
